FP_SIZING: absolute
DIE_AREA:
- 0
- 0
- 2000
- 2000
CORE_AREA:
- 350
- 350
- 1650
- 1650
CLOCK_PORT: clk_PAD
PDN_HOFFSET: 5
PDN_HWIDTH: 2
PDN_HPITCH: 30
PDN_SKIPTRIM: true
DRT_ANTENNA_REPAIR_ITERS: 1
MACROS:
  RM_IHPSG13_1P_1024x32_c2_bm_bist:
    gds:
    - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_1024x32_c2_bm_bist.gds
    lef:
    - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_1024x32_c2_bm_bist.lef
    lib:
      '*_fast_*':
      - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_fast_1p32V_m55C.lib
      '*_slow_*':
      - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_slow_1p08V_125C.lib
      '*_typ_*':
      - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_typ_1p20V_25C.lib
    instances:
      i_soc_top.u_isram.u_mem:
        location:
        - 790.0
        - 370.0
        orientation: FS
      i_soc_top.u_dsram.u_mem:
        location:
        - 790.0
        - 1290.0
        orientation: N
EXTRA_VERILOG_MODELS:
- dir::RM_IHPSG13_1P_1024x32_c2_bm_bist_stub.v
- dir::sg13cmos5l_io_stub.v
PDN_MACRO_CONNECTIONS:
- .*u_mem VPWR VGND VDD! VSS!
- .*u_mem VPWR VGND VDDARRAY! VSS!
