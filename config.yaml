PDN_CORE_RING_HSPACING: 2
PDN_CORE_RING_VOFFSET: 4.5
PDN_CORE_RING_HOFFSET: 4.5
GRT_ALLOW_CONGESTION: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
EXTRA_CDLS:
- pdk_dir::libs.ref/sg13cmos5l_sram/cdl/RM_IHPSG13_1P_1024x32_c2_bm_bist.cdl

PAD_CDLS: [dir::sg13cmos5l_io_fixed.cdl]

# post-route gap fill: plain fill cells only (decap cells have Metal1 inside and landed under Metal1 routing)
DECAP_CELLS: [sg13cmos5l_fill_8, sg13cmos5l_fill_4]

KLAYOUT_LVS_SCRIPT: dir::lvs_local/sg13cmos5l.lvs
KLAYOUT_LVS_OPTIONS:
  run_mode: deep
  blackbox: "sg13cmos5l_Corner,sg13cmos5l_Filler*,sg13cmos5l_IOPad*,sg13cmos5l_Clamp_*,sg13cmos5l_DC*Diode,sg13cmos5l_Level*,sg13cmos5l_GateLevel*,sg13cmos5l_GateDecode,sg13cmos5l_RCClamp*,sg13cmos5l_SecondaryProtection,sg13cmos5l_io_*,RSC_IHPSG13_*,RM_IHPSG13_*,bondpad_*"

KLAYOUT_FILLER_SCRIPT: dir::fill_local/filler_local.py
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
IGNORE_DISCONNECTED_MODULES: [bondpad_70x70]
