PDN_HORIZONTAL_HALO: 90
PDN_VERTICAL_HALO: 90
pdk::ihp-sg13cmos5l:
  FP_CORE_UTIL: 45
PAD_LEFS:
- dir::bondpad/bondpad_70x70.lef
- pdk_dir::libs.ref/sg13cmos5l_io/lef/sg13cmos5l_io.lef
PAD_VERILOG_MODELS:
- dir::bondpad/bondpad_70x70.v
- dir::sg13cmos5l_io_stub.v
PAD_NORTH:
- clk_pad
- rst_n_pad
- vdd_pad
- vss_pad
PAD_WEST:
- g_inputs\[0\].input_pad
- g_outputs\[0\].output_pad
PAD_EAST:
- g_inputs\[1\].input_pad
- g_inputs\[2\].input_pad
- g_inputs\[3\].input_pad
- g_outputs\[1\].output_pad
PAD_SOUTH:
- iovdd_pad
- iovss_pad
PAD_CORNER_SITE_NAME: sg13cmos5l_cornerSite
PAD_BONDPAD_NAME: bondpad_70x70
PAD_BONDPAD_WIDTH: 70
PAD_BONDPAD_HEIGHT: 70
PAD_BONDPAD_OFFSETS:
  "sg13cmos5l_IOPad.*": [5.0, -70.0]
PAD_GDS:
- pdk_dir::libs.ref/sg13cmos5l_io/gds/sg13cmos5l_io.gds
- dir::bondpad/bondpad_70x70.gds
PDN_EXTEND_TO: core_ring
PDN_CORE_RING: true
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_CORE_RING_ALLOW_OUT_OF_DIE: false
PNR_SDC_FILE: dir::soc_padframe.sdc
SIGNOFF_SDC_FILE: dir::soc_padframe.sdc
DRT_ANTENNA_REPAIR_MARGIN: 10
PDN_CORE_RING_VWIDTH: 5
PDN_CORE_RING_HWIDTH: 5
